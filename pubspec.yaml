name: blue_business
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  oktoast:
  provider:
  shared_preferences:
  flutter_secure_storage:
  http:
  flutter_launcher_icons:
  google_fonts:
  flutter_native_splash:
  flutter_spinkit:
  another_flushbar:
  flutter_svg:
  flutter_overlay_loader:
  url_launcher:
  get_it:
  infinite_scroll_pagination:
  share_plus:
  intl:
  http_parser:
  path:
  loading_animation_widget: ^1.2.0+4
  avatar_view: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0


flutter_icons:
 ios: true
 android: true
 image_path_android: 'assets/images/blue_launcher.png'
 image_path_ios: 'assets/images/blue_launcher.png'

flutter:

  uses-material-design: true

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy/Gilroy-Bold.ttf
          weight: 700
        - asset: assets/fonts/Gilroy/Gilroy-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Extrabold.ttf
          weight: 800
        - asset: assets/fonts/Gilroy/Gilroy-ExtraboldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Heavy.ttf
          weight: 300
        - asset: assets/fonts/Gilroy/Gilroy-HeavyItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Medium.ttf
          weight: 100
        - asset: assets/fonts/Gilroy/Gilroy-MediumItalic.ttf
          weight: 100
        - asset: assets/fonts/Gilroy/Gilroy-Light.ttf
          weight: 400
        - asset: assets/fonts/Gilroy/Gilroy-LightItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Regular.ttf
          weight: 500
        - asset: assets/fonts/Gilroy/Gilroy-RegularItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy/Gilroy-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-Thin.ttf
          weight: 200
        - asset: assets/fonts/Gilroy/Gilroy-ThinItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Gilroy/Gilroy-UltraLight.ttf
          weight: 100
        - asset: assets/fonts/Gilroy/Gilroy-UltraLightItalic.ttf
          weight: 100
          style: italic

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/icons/
    # - assets/images/navbar_icons/active/
    # - assets/images/navbar_icons/inactive/
