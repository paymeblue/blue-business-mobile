name: blue_business
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.0+2

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  country_flags: ^3.2.0
  flutter_otp_text_field: ^1.1.1
  avatar_view: ^1.0.1
  loading_animation_widget: ^1.2.1
  overlay_kit: ^1.0.8
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^4.1.0
  oktoast: ^3.4.0
  another_flushbar: ^1.12.30
  dotted_border: ^2.1.0
  nigerian_states_and_lga: ^1.0.0
  fl_chart: 0.66.2
  custom_date_range_picker: ^1.1.0

  #MEDIA UTILS
  barcode: ^2.2.6
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  share_plus: ^10.1.4
  file_picker: ^10.0.0
  local_auth: ^2.1.8
  mobile_scanner: ^6.0.4
  connectivity_plus: ^6.0.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  package_info_plus: ^8.1.2

  #API
  retrofit: ^4.0.3
  dio: ^5.4.0
  http_parser: ^4.0.2
  permission_handler: ^11.2.0
  flutter_contacts: ^1.1.9+2
  salesiq_mobilisten: ^6.1.0
  store_checker: ^1.6.0

  # FIREBASE AND NOTIFICATIONS
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^19.0.0
  firebase_crashlytics: ^4.1.4
  firebase_remote_config: ^5.2.0

  #DEPENDENCY INJECTION
  get_it: ^8.0.3
  provider: ^6.1.1
  change_app_package_name: ^1.1.0

  #ANNOTATION AND MODELLING
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1
  
  #NAVIGATION
  go_router: ^14.8.1

  #LOGGING
  logger: 1.4.0

  #URL
  url_launcher: ^6.2.2 

  #SECURE STORAGE
  flutter_secure_storage: ^10.0.0-beta.4

  #FORMATTING
  intl: ^0.19.0
  currency_text_input_formatter: ^2.1.11
  syncfusion_flutter_gauges: ^29.1.35
  flutter_screenutil: ^5.9.3

  #WEBVIEW
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.3.4
  webview_flutter_wkwebview: ^3.14.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  #ANNOTATION
  build_runner: ^2.4.7
  flutter_gen_runner:
  freezed: ^3.0.4
  json_serializable: ^6.7.1
  retrofit_generator: ^9.1.9

flutter_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path_android: 'assets/images/blue_launcher.png'
  image_path_ios: 'assets/images/blue_launcher.png'


flutter_gen:
  output: lib/core/gen/
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: false
  fonts:
    outputs:
      class_name: AppFonts
      package_parameter_enabled: false
  colors:
    outputs:
      class_name: AppColors
    inputs:
      - assets/color/colors.xml
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Black.otf
          weight: 700
        - asset: assets/fonts/Satoshi/Satoshi-BlackItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Bold.otf
          weight: 600
        - asset: assets/fonts/Satoshi/Satoshi-BoldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-LightItalic.otf
          weight: 300
          style: italic

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/icons/
    - assets/images/navbar_icons/active/
    - assets/images/navbar_icons/inactive/
    - shorebird.yaml
